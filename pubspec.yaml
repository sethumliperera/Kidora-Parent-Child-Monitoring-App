name: kidora_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.5+1

  # Network
  http: ^1.6.0
  http_parser: any
  flutter_animate: ^4.5.2

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3

  # Firebase (COMPATIBLE VERSIONS)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # App Features
  installed_apps: ^1.1.2
  usage_stats: ^1.0.5

  # Background & Notifications
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^21.0.0

  # Android Intents
  android_intent_plus: ^4.0.1
  socket_io_client: ^3.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/kidora_logo.jpeg
    - assets/icons/screen_time.png
    - assets/icons/alex.png
    - assets/icons/emma.png
    - assets/icons/app_block.png
    - assets/icons/reminders.png
    - assets/icons/restrictions.png
    - assets/icons/facebook.png
    - assets/icons/freefire.jpeg
    - assets/icons/chrome.jpeg
    - assets/icons/instagram.jpeg
    - assets/icons/snapchat.png
    - assets/icons/tiktok.png
    - assets/icons/youtube.jpeg
    - assets/icons/zapp.png
    - assets/icons/google.png